name: contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.18,<5"
      - name: Run contract tests
        working-directory: titanloom-contracts
        run: |
          set -e
          for t in test_contracts*.py; do
            echo "== $t"
            python "$t"
          done
