# Titanloom pre-commit 钩子
# 安装与使用见 CONTRIBUTING.md「提交前检查」。

repos:
  # 通用文件卫生：去行尾空格、补文件末尾换行、拦截大文件（> 1 MB）
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # 提交前密钥扫描（gitleaks，钉死版本，不用 latest）
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
